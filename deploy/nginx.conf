server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    client_max_body_size 15m;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 65s;
        proxy_connect_timeout 5s;
    }
}
